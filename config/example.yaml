# A complete example config. Every key is explained in docs/configuration/.
# Durations take plain milliseconds or a suffix: ms, s, m, h, d.

# docs/configuration/README.md
policy:
  strategy: fifo-exhaustive
  min_dwell: 5m
  max_dwell: 2h
  idle_grace: 10m
  age_threshold: 30m
  queue_reading_stale_after: 10m
  host_reading_stale_after: 30s
  interactive_ttl: 15m
  drain_timeout: 10m
  # lockout_timeout: 10m

# docs/configuration/power.md
resources:
  # No power section: always up.
  - id: blade-runner
    kind: shared
  - id: cuda-central
    kind: exclusive
    power:
      wake_on_lan: { router_url: "https://router.example.internal", interface: lan, mac: "02:00:00:00:00:01" }
      shutdown: { host: cuda-central, port: 22, user: poweroff, host_key: "SHA256:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" }
      # manual: a person powers the host. managed: flowmanager does, and needs both sections above.
      control: manual
      power_on_timeout: 10m
      shutdown_timeout: 15m
      veto_timeout: 30m
  - id: basestar-nfs
    kind: shared
    power:
      wake_on_lan: { router_url: "https://router.example.internal", interface: lan, mac: "02:00:00:00:00:02" }
      shutdown: { host: basestar, port: 22, user: poweroff, host_key: "SHA256:BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB" }
      control: manual
      power_on_timeout: 5m
      shutdown_timeout: 10m
      veto_timeout: 30m
      # min_off: 10m

# docs/configuration/workloads.md
models:
  - { id: mineru, resource: cuda-central, load_time: 120s, workloads: [mineru], namespaces: [ai] }
  - { id: llm, resource: cuda-central, load_time: 90s, workloads: [ollama], namespaces: [ai] }
  - { id: whisperx, resource: cuda-central, load_time: 60s, workloads: [whisperx], namespaces: [ai] }
  - { id: immich-ml, resource: cuda-central, load_time: 45s, workloads: [immich-machine-learning-gpu], namespaces: [media] }

# docs/configuration/workloads.md
classes:
  # Demand classes: a model and a demand source.
  - id: paperless-ocr
    requires:
      - { resource: cuda-central, model: mineru }
      - { resource: basestar-nfs }
    priority: 50
    preemptibility: kill
    demand: { source: paperless-ocr-pending }

  - id: paperless-tagging
    requires:
      - { resource: cuda-central, model: llm }
      - { resource: basestar-nfs }
    priority: 50
    preemptibility: kill
    demand: { source: paperless-post-ocr }

  - id: speakr-transcription
    requires:
      - { resource: cuda-central, model: whisperx }
      - { resource: basestar-nfs }
    priority: 60
    preemptibility: kill
    demand: { source: speakr-pending }
    # Re-queues failed transcriptions while whisperx is allowed.
    recovery:
      action: requeue_failed
      source: speakr-pending
      params:
        list:
          url: http://speakr.media.svc:8899/api/v1/recordings?status=failed&per_page=100&sort_by=updated_at&sort_order=desc
          items: /recordings
          id: /id
          where: { field: /has_summary, equals: false }
          since: { param: updated_since, ago: 15m }
          max_items: 100
        requeue:
          method: POST
          url: http://speakr.media.svc:8899/api/v1/recordings/{id}/transcribe
          body: {}
          expect:
            - { field: /success, equals: true }
            - { field: /status, equals: QUEUED }
        auth: { header: Authorization, prefix: "Bearer ", env: SPEAKR_API_TOKEN }
        max_attempts: 2
        window: 15m
        retention: 24h
        min_interval: 60s
        max_per_run: 5
        timeout: 10s

  - id: speakr-summarization
    requires:
      - { resource: cuda-central, model: llm }
      - { resource: basestar-nfs }
    priority: 60
    preemptibility: kill
    demand: { source: speakr-summaries }
    # Re-queues recordings whose automatic summary failed (the list form of `where`, as in
    # speakr-summaries). The summarize endpoint below is an assumption; check it against
    # your Speakr version.
    recovery:
      action: requeue_failed
      source: speakr-summaries
      params:
        list:
          url: http://speakr.media.svc:8899/api/v1/recordings?status=completed&per_page=100&sort_by=updated_at&sort_order=desc
          items: /recordings
          id: /id
          where:
            - { field: /has_summary, equals: true }
            - { field: /summarization_duration_seconds, is_null: true }
          since: { param: updated_since, ago: 30m }
          max_items: 100
        requeue:
          method: POST
          url: http://speakr.media.svc:8899/api/v1/recordings/{id}/summarize
          body: {}
          expect:
            - { field: /success, equals: true }
        auth: { header: Authorization, prefix: "Bearer ", env: SPEAKR_API_TOKEN }
        max_attempts: 2
        window: 30m
        retention: 24h
        min_interval: 60s
        max_per_run: 5
        timeout: 10s

  - id: immich-ml
    requires:
      - { resource: cuda-central, model: immich-ml }
      - { resource: basestar-nfs }
    priority: 10
    preemptibility: kill
    demand: { source: immich-queues }

  # Inert: the session kind has no observer (docs/configuration/sources.md).
  - id: interactive-llm
    requires:
      - { resource: cuda-central, model: llm }
    priority: 100
    preemptibility: none
    demand: { source: llm-sessions }

  # Plain classes: no demand; they run while their shared hosts are up.
  - id: paperless-ngx
    requires:
      - { resource: basestar-nfs }
    priority: 0
    preemptibility: none

  - id: immich-server
    requires:
      - { resource: basestar-nfs }
    priority: 0
    preemptibility: none

  # Gate class: an exclusive host without a model means only that the host is up.
  - id: paperless-gpt
    requires:
      - { resource: cuda-central }
      - { resource: basestar-nfs }
    priority: 0
    preemptibility: none

  # Switched class: an app a person turns on and off.
  - id: wikijs
    requires:
      - { resource: blade-runner }
    priority: 0
    preemptibility: kill
    switch: { source: ha-wikijs }

# docs/configuration/sources.md
sources:
  - id: cluster-pods
    kind: kubernetes_watch
    resync: 10s
    observe: [pods, reachability]
    params:
      namespaces: [ai, media, docs]
      workload_label: app.kubernetes.io/name
      nodes: { cuda-central: cuda-central }
      reachability_confirmations: 3

  # basestar is not a Kubernetes node, so a TCP connect to its NFS port says whether it is up.
  - id: basestar-probe
    kind: tcp_probe
    observe: [reachability]
    resync: 10s
    params:
      host: basestar
      port: 2049
      resource: basestar-nfs
      timeout: 2s
      reachability_confirmations: 3

  # Pods that mount basestar's NFS export: the veto before it is powered off.
  - id: basestar-mounts
    kind: kubernetes_watch
    observe: [mounts]
    resync: 10s
    params:
      nfs_servers: { basestar-nfs: [basestar] }

  # The Jobs flowmanager made for `jobs` below.
  - id: scheduled-jobs
    kind: kubernetes_watch
    observe: [jobs]
    resync: 10s
    params:
      job_namespaces: [backups]

  - id: paperless-ocr-pending
    kind: http_json
    observe: [demand]
    resync: 60s
    params:
      timeout: 10s
      auth: { header: Authorization, prefix: "Token ", env: PAPERLESS_API_TOKEN }
      requests:
        # page_size=1: only the `count` is used.
        - url: http://paperless-ngx.docs.svc:8000/api/documents/?tags__name__iexact=ocr-pending&page_size=1
          count: /count
      webhook: { path: /hooks/paperless }

  - id: paperless-post-ocr
    kind: http_json
    observe: [demand]
    resync: 60s
    params:
      timeout: 10s
      auth: { header: Authorization, prefix: "Token ", env: PAPERLESS_API_TOKEN }
      requests:
        - url: http://paperless-ngx.docs.svc:8000/api/documents/?tags__name__iexact=post-ocr&page_size=1
          count: /count
      webhook: { path: /hooks/paperless }

  # Ready and in-flight work from the stats, and failed items from a filtered list.
  - id: speakr-pending
    kind: http_json
    observe: [demand]
    resync: 60s
    params:
      timeout: 10s
      auth: { header: Authorization, prefix: "Bearer ", env: SPEAKR_API_TOKEN }
      requests:
        - url: http://speakr.media.svc:8899/api/v1/stats
          count: /recordings/pending
          also:
            - { count: /queue/jobs_queued, counts_as: ready }
            - { count: /queue/jobs_processing, counts_as: in_flight }
        - url: http://speakr.media.svc:8899/api/v1/recordings?status=failed&per_page=100&sort_by=updated_at&sort_order=desc
          length: /recordings
          where: { field: /has_summary, equals: false }
          max_items: 100
          since: { param: updated_since, ago: 15m }
          counts_as: failed
      webhook: { path: /hooks/speakr }

  - id: speakr-summaries
    kind: http_json
    observe: [demand]
    resync: 60s
    params:
      timeout: 10s
      auth: { header: Authorization, prefix: "Bearer ", env: SPEAKR_API_TOKEN }
      requests:
        - url: http://speakr.media.svc:8899/api/v1/recordings?status=processing&per_page=100
          length: /recordings
          where: { field: /status, equals: SUMMARIZING }
          max_items: 100
        # Speakr 0.11.4 and later: a failed automatic summary after a transcript leaves the
        # recording COMPLETED with the error text in `summary` (has_summary true) and no
        # summarization_duration_seconds. Caveat: a summary written by hand on a recording
        # that was never summarized automatically looks the same and would be counted.
        - url: http://speakr.media.svc:8899/api/v1/recordings?status=completed&per_page=100&sort_by=updated_at&sort_order=desc
          length: /recordings
          where:
            - { field: /has_summary, equals: true }
            - { field: /summarization_duration_seconds, is_null: true }
          max_items: 100
          since: { param: updated_since, ago: 30m }
          counts_as: failed
      webhook: { path: /hooks/speakr }

  # Three queues, skipped while paused; `waiting` and `delayed` are ready, `active` is in flight.
  - id: immich-queues
    kind: http_json
    observe: [demand]
    resync: 120s
    params:
      timeout: 10s
      auth: { header: x-api-key, env: IMMICH_API_KEY }
      requests:
        - url: http://immich-server.media.svc:2283/api/queues/smartSearch
          when: { field: /isPaused, equals: false }
          count: /statistics/waiting
          also:
            - { count: /statistics/delayed, counts_as: ready }
            - { count: /statistics/active, counts_as: in_flight }
        - url: http://immich-server.media.svc:2283/api/queues/faceDetection
          when: { field: /isPaused, equals: false }
          count: /statistics/waiting
          also:
            - { count: /statistics/delayed, counts_as: ready }
            - { count: /statistics/active, counts_as: in_flight }
        - url: http://immich-server.media.svc:2283/api/queues/ocr
          when: { field: /isPaused, equals: false }
          count: /statistics/waiting
          also:
            - { count: /statistics/delayed, counts_as: ready }
            - { count: /statistics/active, counts_as: in_flight }

  # Inert: the session kind has no observer.
  - id: llm-sessions
    kind: session
    observe: [demand]
    resync: 30s

  # A switch source: `map` turns the app's state into on, off or off_now.
  - id: ha-wikijs
    kind: http_json
    observe: [switch]
    resync: 30s
    params:
      timeout: 10s
      auth: { header: Authorization, prefix: "Bearer ", env: HA_TOKEN }
      requests:
        - url: http://homeassistant.example.internal:8123/api/states/input_select.app_wikijs
          value: /state
          map: { "on": on, "off": off, "off-now": off_now }

# Scheduled jobs: docs/configuration/jobs.md
jobs:
  - id: backup
    # Five-field crontab in `timezone`: Sundays at 03:00.
    cron: "0 3 * * 0"
    timezone: UTC
    cronjob: { namespace: backups, name: postgres-backup }
    needs:
      - { type: nfs, resource: basestar-nfs }
    # Retries after a failed Job; the wait doubles from `retry_backoff`.
    retries: 1
    retry_backoff: 5m
    missed_run: catch_up
    start_window: 30m
    deadline: 6h
