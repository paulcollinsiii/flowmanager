# Example scheduler configuration describing the current workloads.
# Service-specific names live here only; the crates treat them as opaque ids.
# Durations accept plain milliseconds or a suffix: ms, s, m, h, d.

policy:
  strategy: fifo-exhaustive
  min_dwell: 5m
  max_dwell: 2h
  idle_grace: 10m
  age_threshold: 30m
  demand_max_age: 10m
  safety_max_age: 30s
  interactive_ttl: 15m
  drain_timeout: 10m

resources:
  - id: cuda-central
    kind: exclusive
    power:
      actuator: wake_on_lan
      params: { mac: "00:00:00:00:00:01", shutdown: ssh_forced_command }
  - id: basestar-nfs
    kind: shared
    power:
      actuator: ssh_power
      params: { host: basestar }

models:
  - { id: mineru, resource: cuda-central, load_time: 120s, workloads: [mineru] }
  - { id: llm, resource: cuda-central, load_time: 90s, workloads: [ollama] }
  - { id: whisperx, resource: cuda-central, load_time: 60s, workloads: [whisperx] }
  - { id: immich-ml, resource: cuda-central, load_time: 45s, workloads: [immich-machine-learning-gpu] }

classes:
  - id: paperless-ocr
    requires:
      - { resource: cuda-central, model: mineru }
      - { resource: basestar-nfs }
    priority: 50
    preemptibility: pause_intake
    demand: { source: paperless-ocr-pending }

  - id: paperless-tagging
    requires:
      - { resource: cuda-central, model: llm }
      - { resource: basestar-nfs }
    priority: 50
    preemptibility: pause_intake
    demand: { source: paperless-post-ocr }

  - id: speakr-transcription
    requires:
      - { resource: cuda-central, model: whisperx }
      - { resource: basestar-nfs }
    priority: 60
    # speakr marks interrupted jobs failed; they are re-queued through its API.
    preemptibility: kill
    demand: { source: speakr-pending }
    recovery:
      action: requeue_failed
      source: speakr-pending

  - id: speakr-summarization
    requires:
      - { resource: cuda-central, model: llm }
      - { resource: basestar-nfs }
    priority: 60
    preemptibility: pause_intake
    demand: { source: speakr-summaries }

  - id: immich-ml
    requires:
      - { resource: cuda-central, model: immich-ml }
      - { resource: basestar-nfs }
    # An accelerator only: a CPU replica always serves, so it ranks below work that would wait.
    priority: 10
    # immich leaves interrupted work pending and easy to find.
    preemptibility: kill
    demand: { source: immich-queues }

  - id: backup
    requires:
      - { resource: basestar-nfs }
    priority: 70
    preemptibility: none
    may_change_power: true
    demand: { source: backup-schedule }

  - id: interactive-llm
    requires:
      - { resource: cuda-central, model: llm }
    priority: 100
    preemptibility: none
    demand: { source: llm-sessions }

  # NFS-only services: no demand of their own; they run whenever NFS is up.
  - id: paperless-ngx
    requires:
      - { resource: basestar-nfs }
    priority: 0
    preemptibility: none

  - id: immich-server
    requires:
      - { resource: basestar-nfs }
    priority: 0
    preemptibility: none

sources:
  - id: cluster-pods
    kind: kubernetes_watch
    resync: 10s
    observe: [pods, reachability]
    params:
      namespaces: [ai, media, docs]
      # Pod label whose value is the model's workload name (models[].workloads).
      workload_label: app.kubernetes.io/name
      # Resource -> Kubernetes node name. Only listed resources get reachability.
      nodes: { cuda-central: cuda-central }
      # Consecutive agreeing checks (one per resync) before a host's up/down flips.
      reachability_confirmations: 3

  # basestar is not a Kubernetes node: its reachability comes from a TCP connect probe,
  # the same check power.py makes (a plain connect to the NFS port, 2049). Each resync
  # makes one connect to host:port, closing the connection at once. `timeout` bounds the
  # whole probe, name lookup included.
  # - connected: up.
  # - the host does not answer or answers no: down. That is connection refused, no answer
  #   within `timeout`, or "no route to host" (what Linux reports, after about 3s, for an
  #   address on the local network that does not answer ARP, as a powered-off basestar).
  # - anything else is a failed read (the reading goes stale), never "down": the name does
  #   not resolve (or its lookup does not finish within `timeout`), "network unreachable"
  #   (no route at all), an unusable address, or any other local error.
  # If the name has several addresses, all are tried at once: up if any connects, down
  # only if every one answered down, otherwise a failed read.
  # It checks that the host accepts connections on the port, not that the NFS export works.
  # Only basestar-nfs gets reachability from this source.
  - id: basestar-probe
    kind: tcp_probe
    observe: [reachability]
    resync: 10s
    params:
      host: basestar
      port: 2049
      resource: basestar-nfs
      timeout: 2s
      # Consecutive agreeing readings before up/down flips (as for cluster-pods).
      reachability_confirmations: 3

  # The `prometheus` kind is also available for reachability: one instant query per resync
  # that must return exactly one series, 1 up and 0 down (anything else is a failed read).
  # Not used here, as no blackbox exporter probes basestar. For a probed host it would be:
  #   - id: some-host-probe
  #     kind: prometheus
  #     observe: [reachability]
  #     resync: 10s
  #     params:
  #       url: http://prometheus.monitoring.svc:9090
  #       query: probe_success{instance="some-host", job="blackbox-ssh"}
  #       resource: some-resource
  #       timeout: 5s
  #       reachability_confirmations: 3
  #       # Optional, as for http_json: auth: { header: Authorization, prefix: "Bearer ", env: PROMETHEUS_TOKEN }

  # Secrets are never in this file: `auth` names an environment variable (or a mounted
  # file) that holds the token.
  - id: paperless-ocr-pending
    kind: http_json
    observe: [demand]
    resync: 60s
    params:
      timeout: 10s
      auth: { header: Authorization, prefix: "Token ", env: PAPERLESS_API_TOKEN }
      requests:
        # page_size=1: only the `count` of the document list is used.
        - url: http://paperless-ngx.docs.svc:8000/api/documents/?tags__name__iexact=ocr-pending&page_size=1
          count: /count
      webhook: { path: /hooks/paperless }

  - id: paperless-post-ocr
    kind: http_json
    observe: [demand]
    resync: 60s
    params:
      timeout: 10s
      auth: { header: Authorization, prefix: "Token ", env: PAPERLESS_API_TOKEN }
      requests:
        - url: http://paperless-ngx.docs.svc:8000/api/documents/?tags__name__iexact=post-ocr&page_size=1
          count: /count
      webhook: { path: /hooks/paperless }

  # Speakr transcription demand.
  #
  # Field names and behaviour come from speakr's v1 API reference and source
  # (src/api/api_v1.py, src/services/job_queue.py):
  # - Enqueueing a job sets the recording to QUEUED, which NO list status filter matches
  #   (`pending` is only the state before enqueue). So waiting work is counted from
  #   GET /api/v1/stats instead: `recordings.pending` plus `queue.jobs_queued` (ProcessingJob
  #   rows, of ALL job types for the token's user), with `queue.jobs_processing` as in-flight
  #   work. Queued summary (and other non-transcription) jobs are therefore also counted
  #   here: a deliberate, conservative overcount (they are GPU/LLM demand of some class, not
  #   necessarily transcription), and the planner treats ready > 0 as work.
  # - Failed transcriptions are ready demand too, so that a whisperX outage brings whisperX
  #   in rather than hiding the work. Retries are immediate (JOB_MAX_RETRIES = 3), so with
  #   whisperX unloaded a job fails within seconds and leaves the queue counts above. When a
  #   job gives up, speakr sets the recording FAILED and stores the error in `summary` for
  #   summarize/reprocess_summary jobs and in `transcription` for every other job type; list
  #   items expose only `has_summary` / `has_transcription`. So the second request lists
  #   FAILED recordings and counts those with `has_summary: false` (a failed transcription).
  #   `equals: false` is the JSON boolean; `equals: "false"` would be the text.
  #   A reprocess_transcription failure on a recording that already has a summary is missed
  #   (accepted), and a failed merge/stitch job counts as transcription (overcount).
  #   The window: only recordings updated in the last `since.ago` (15m) are listed. 15m is
  #   below policy.age_threshold (30m), so a failure never reaches starvation priority.
  #   - A failure counts as whisperX demand until it is re-queued or 15m pass.
  #   - Any later edit of a FAILED recording (tags, title, inbox, highlight, share) bumps its
  #     `updated_at` and restarts its window.
  #   - Permanent failures (a bad file, an unsupported codec) count too, until the window
  #     passes.
  #   - Failed transcriptions are re-queued automatically (a later M3 phase), at most twice
  #     per recording; after that it stays FAILED and ages out of the window.
  #   More than 100 failures in the window is a full page and fails the poll (max_items)
  #   instead of under-counting. An item whose `has_summary` is not a boolean (null aside)
  #   also fails the poll, rather than counting low.
  # Cost: 2 requests per poll here plus 1 for speakr-summaries below, at one poll a minute
  # each: 3 requests per minute in total on the one token, against speakr's read limit of
  # 120/min (add up all speakr sources before raising `resync` rates).
  # Auth: `Authorization: Bearer <token>`; a token with `read` scope is enough.
  - id: speakr-pending
    kind: http_json
    observe: [demand]
    resync: 60s
    params:
      timeout: 10s
      auth: { header: Authorization, prefix: "Bearer ", env: SPEAKR_API_TOKEN }
      requests:
        - url: http://speakr.media.svc:8899/api/v1/stats
          count: /recordings/pending
          also:
            - { count: /queue/jobs_queued, counts_as: ready }
            - { count: /queue/jobs_processing, counts_as: in_flight }
        # Failed transcriptions in the last 15m (updated_since=<now - 15m> is appended).
        - url: http://speakr.media.svc:8899/api/v1/recordings?status=failed&per_page=100&sort_by=updated_at&sort_order=desc
          length: /recordings
          where: { field: /has_summary, equals: false }
          max_items: 100
          since: { param: updated_since, ago: 15m }
      webhook: { path: /hooks/speakr }

  # Summarization. The status filter has no `summarizing` value, but `status=processing`
  # returns both PROCESSING and SUMMARIZING recordings (speakr src/api/api_v1.py:
  # `Recording.status.in_(['PROCESSING', 'SUMMARIZING'])`), so this lists that page and keeps
  # those whose `status` is SUMMARIZING. Enqueueing a summary job sets SUMMARIZING at once,
  # so queued and running summary jobs are both visible here.
  - id: speakr-summaries
    kind: http_json
    observe: [demand]
    resync: 60s
    params:
      timeout: 10s
      auth: { header: Authorization, prefix: "Bearer ", env: SPEAKR_API_TOKEN }
      requests:
        - url: http://speakr.media.svc:8899/api/v1/recordings?status=processing&per_page=100
          length: /recordings
          where: { field: /status, equals: SUMMARIZING }
          max_items: 100
      webhook: { path: /hooks/speakr }

  # immich ML demand: the three ML-backed queues (smartSearch, faceDetection, ocr), read
  # with GET /api/queues/{name} (added in immich v2.4.0, where GET /api/jobs became
  # deprecated; this deployment runs v4.0 or later). The endpoint is marked alpha in immich
  # (`.alpha('v2.4.0')` in queue.controller.ts), so its shape may still change; a changed
  # shape fails the poll rather than counting zero. Each returns `{"name", "isPaused",
  # "statistics": {"active", "completed", "failed", "delayed", "waiting", "paused"}}`:
  # `waiting` + `delayed` count as ready, `active` as in-flight, summed over the three
  # queues. A paused queue counts as zero (ready and in-flight): from v4.0 a paused queue
  # reports its jobs under `waiting`, so `when` skips a response whose top-level `isPaused`
  # is not false (a missing or non-boolean `isPaused` fails the poll).
  # Auth: an API key with the `queue.read` permission (the endpoint is admin-only), sent as
  # `x-api-key: <key>` with no prefix. Cost: 3 requests per poll, every 120s.
  - id: immich-queues
    kind: http_json
    observe: [demand]
    resync: 120s
    params:
      timeout: 10s
      auth: { header: x-api-key, env: IMMICH_API_KEY }
      requests:
        - url: http://immich-server.media.svc:2283/api/queues/smartSearch
          when: { field: /isPaused, equals: false }
          count: /statistics/waiting
          also:
            - { count: /statistics/delayed, counts_as: ready }
            - { count: /statistics/active, counts_as: in_flight }
        - url: http://immich-server.media.svc:2283/api/queues/faceDetection
          when: { field: /isPaused, equals: false }
          count: /statistics/waiting
          also:
            - { count: /statistics/delayed, counts_as: ready }
            - { count: /statistics/active, counts_as: in_flight }
        - url: http://immich-server.media.svc:2283/api/queues/ocr
          when: { field: /isPaused, equals: false }
          count: /statistics/waiting
          also:
            - { count: /statistics/delayed, counts_as: ready }
            - { count: /statistics/active, counts_as: in_flight }

  - id: backup-schedule
    kind: schedule
    observe: [demand]
    resync: 60s
    params: { cron: "0 3 * * 0" }

  - id: llm-sessions
    kind: session
    observe: [demand]
    resync: 30s
