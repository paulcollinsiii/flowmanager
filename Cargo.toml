[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10"
# Cron expressions for scheduled jobs: pure computation (it needs only jiff, which kube already
# pulls in), used by sched-model to validate and evaluate a job's schedule in its own timezone.
cronexpr = "1.7.0"
thiserror = "2"
proptest = "1"
# I/O dependencies: only the I/O crates (sched-observe, sched-service) may use these.
clap = { version = "4.6.7", features = ["derive", "env"] }
# sched-observe needs StreamExt to consume kube watch streams.
futures = { version = "0.3", default-features = false, features = ["std"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
k8s-openapi = { version = "0.28.0", features = ["v1_36"] }
# One TLS crypto provider only (aws-lc-rs, which reqwest already selects). kube's default also
# enables ring, and rustls panics at client creation when it finds both and none is installed.
kube = { version = "4.2.0", default-features = false, features = ["client", "runtime", "rustls-tls", "aws-lc-rs"] }
prometheus = { version = "0.14.0", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
restate-sdk = "0.12.1"
# SSH client for the forced-command shutdown (sched-actuate only; as used by the legacy root crate).
russh = "0.64.1"
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
# gRPC for the KEDA external scaler (sched-keda only; approved in M3). tonic 0.14 moved the
# prost codec and its build-time codegen into tonic-prost and tonic-prost-build.
tonic = { version = "0.14.6", default-features = false, features = ["transport", "codegen", "router"] }
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
prost = "0.14.4"
sched-model = { path = "crates/sched-model" }
sched-planner = { path = "crates/sched-planner" }
sched-sequencer = { path = "crates/sched-sequencer" }
sched-observe = { path = "crates/sched-observe" }
sched-actuate = { path = "crates/sched-actuate" }
sched-keda = { path = "crates/sched-keda" }

[package]
name = "flowmanager"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { workspace = true }
k8s-openapi = { workspace = true }
kube = { workspace = true }
reqwest = { workspace = true }
restate-sdk = { workspace = true }
russh = "0.64.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
twelf = "0.15.0"
