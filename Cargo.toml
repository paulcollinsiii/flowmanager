[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10"
thiserror = "2"
proptest = "1"
sched-model = { path = "crates/sched-model" }
sched-planner = { path = "crates/sched-planner" }
sched-sequencer = { path = "crates/sched-sequencer" }
sched-observe = { path = "crates/sched-observe" }
sched-actuate = { path = "crates/sched-actuate" }
sched-keda = { path = "crates/sched-keda" }

[package]
name = "flowmanager"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
k8s-openapi = { version = "0.28.0", features = ["v1_36"] }
kube = { version = "4.2.0", features = ["client", "runtime"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
restate-sdk = "0.12.1"
russh = "0.64.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
twelf = "0.15.0"
