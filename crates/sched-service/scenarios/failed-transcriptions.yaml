description: "Failed transcriptions alone bring whisperx in; RunRecovery is withheld while its pod is missing or not ready, emitted from the first tick the pod is ready and on every tick while it serves and items are still failed; once they are re-queued (no failed items) no recovery step is emitted, and the model is released only after idle_grace."
initial_state:
  resources:
    cuda-central:
      power: { phase: "on", since: 92800000 }
      mode: { phase: idle }
frames:
  - at: 100000000
    observe:
      - { source: cluster-pods, value: { type: model_pods, model: mineru, pods: 0, ready_pods: 0 } }
      - { source: cluster-pods, value: { type: model_pods, model: llm, pods: 0, ready_pods: 0 } }
      - { source: cluster-pods, value: { type: model_pods, model: whisperx, pods: 0, ready_pods: 0 } }
      - { source: cluster-pods, value: { type: model_pods, model: immich-ml, pods: 0, ready_pods: 0 } }
      - { source: cluster-pods, value: { type: resource_up, resource: cuda-central, up: true } }
      - { source: cluster-pods, value: { type: resource_up, resource: basestar-nfs, up: true } }
      - { source: paperless-ocr-pending, value: { type: demand, class: paperless-ocr, ready: 0, in_flight: 0 } }
      - { source: paperless-post-ocr, value: { type: demand, class: paperless-tagging, ready: 0, in_flight: 0 } }
      - { source: speakr-pending, value: { type: demand, class: speakr-transcription, ready: 0, in_flight: 0, failed: 2 } }
      - { source: speakr-summaries, value: { type: demand, class: speakr-summarization, ready: 0, in_flight: 0 } }
      - { source: immich-queues, value: { type: demand, class: immich-ml, ready: 0, in_flight: 0 } }
      - { source: llm-sessions, value: { type: demand, class: interactive-llm, ready: 0, in_flight: 0 } }
    expect:
      steps: [{ type: allow_model, resource: cuda-central, model: whisperx }]
      allowed: { models: [whisperx], classes: [paperless-ngx, immich-server, paperless-gpt, speakr-transcription] }
  # The pod exists but is not ready: a re-queue now would meet a 503, so it still waits.
  - at: 100030000
    observe:
      - { source: cluster-pods, value: { type: model_pods, model: whisperx, pods: 1, ready_pods: 0 } }
    refresh: true
    expect:
      steps: []
      allowed: { models: [whisperx], classes: [paperless-ngx, immich-server, paperless-gpt, speakr-transcription] }
  # Ready, items still failed (the re-queue is paced by the action itself): emitted, and again each tick.
  - at: 100060000
    observe:
      - { source: cluster-pods, value: { type: model_pods, model: whisperx, pods: 1, ready_pods: 1 } }
    refresh: true
    expect:
      steps: [{ type: run_recovery, class: speakr-transcription }]
      allowed: { models: [whisperx], classes: [paperless-ngx, immich-server, paperless-gpt, speakr-transcription] }
  - at: 100090000
    refresh: true
    expect:
      steps: [{ type: run_recovery, class: speakr-transcription }]
      allowed: { models: [whisperx], classes: [paperless-ngx, immich-server, paperless-gpt, speakr-transcription] }
  # Re-queued: the work shows as ready (stats), nothing failed.
  - at: 100120000
    observe:
      - { source: speakr-pending, value: { type: demand, class: speakr-transcription, ready: 2, in_flight: 0, failed: 0 } }
    refresh: true
    expect:
      steps: []
      allowed: { models: [whisperx], classes: [paperless-ngx, immich-server, paperless-gpt, speakr-transcription] }
  # Done. Idle clock starts here; grace is not over a minute before 10m.
  - at: 100180000
    observe:
      - { source: speakr-pending, value: { type: demand, class: speakr-transcription, ready: 0, in_flight: 0, failed: 0 } }
    refresh: true
    expect:
      steps: []
  - at: 100779000
    refresh: true
    expect:
      steps: []
  - at: 100780000
    refresh: true
    expect:
      steps: [{ type: pause_intake, class: speakr-transcription }, { type: drain_model, resource: cuda-central, model: whisperx }]
      allowed: { models: [], classes: [paperless-ngx, immich-server, paperless-gpt] }
