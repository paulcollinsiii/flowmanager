description: "Failed items never age into starvation priority and never hold a model: mineru keeps its ready work while whisperx has only failed items (however long they stay listed), and once mineru is idle for idle_grace the GPU goes to whisperx, with RunRecovery only once its pod is ready."
initial_state:
  resources:
    cuda-central:
      power: { phase: "on", since: 92800000 }
      mode: { phase: serving, model: mineru, since: 99000000 }
frames:
  - at: 100000000
    observe:
      - { source: cluster-pods, value: { type: model_pods, model: mineru, pods: 0, ready_pods: 0 } }
      - { source: cluster-pods, value: { type: model_pods, model: llm, pods: 0, ready_pods: 0 } }
      - { source: cluster-pods, value: { type: model_pods, model: whisperx, pods: 0, ready_pods: 0 } }
      - { source: cluster-pods, value: { type: model_pods, model: immich-ml, pods: 0, ready_pods: 0 } }
      - { source: cluster-pods, value: { type: resource_up, resource: cuda-central, up: true } }
      - { source: cluster-pods, value: { type: resource_up, resource: basestar-nfs, up: true } }
      - { source: paperless-ocr-pending, value: { type: demand, class: paperless-ocr, ready: 5, in_flight: 0 } }
      - { source: paperless-post-ocr, value: { type: demand, class: paperless-tagging, ready: 0, in_flight: 0 } }
      - { source: speakr-pending, value: { type: demand, class: speakr-transcription, ready: 0, in_flight: 0, failed: 3 } }
      - { source: speakr-summaries, value: { type: demand, class: speakr-summarization, ready: 0, in_flight: 0 } }
      - { source: immich-queues, value: { type: demand, class: immich-ml, ready: 0, in_flight: 0 } }
      - { source: llm-sessions, value: { type: demand, class: interactive-llm, ready: 0, in_flight: 0 } }
    expect:
      steps: []
      allowed: { models: [mineru], classes: [paperless-ngx, immich-server, paperless-gpt, paperless-ocr] }
  # 40 and 80 minutes later (past age_threshold 30m, below max_dwell): the failed items have
  # no age, so whisperx is not starved and mineru keeps the GPU. Nothing is emitted for a
  # class that is not allowed.
  - at: 102400000
    refresh: true
    expect:
      steps: []
      allowed: { models: [mineru], classes: [paperless-ngx, immich-server, paperless-gpt, paperless-ocr] }
  - at: 104800000
    refresh: true
    expect:
      steps: []
      allowed: { models: [mineru], classes: [paperless-ngx, immich-server, paperless-gpt, paperless-ocr] }
  # The ocr queue empties: mineru is idle from here.
  - at: 105000000
    observe:
      - { source: paperless-ocr-pending, value: { type: demand, class: paperless-ocr, ready: 0, in_flight: 0 } }
    refresh: true
    expect:
      steps: []
  - at: 105599000
    refresh: true
    expect:
      steps: []
  - at: 105600000
    refresh: true
    expect:
      steps: [{ type: pause_intake, class: paperless-ocr }, { type: drain_model, resource: cuda-central, model: mineru }, { type: allow_model, resource: cuda-central, model: whisperx }]
      allowed: { models: [whisperx], classes: [paperless-ngx, immich-server, paperless-gpt, speakr-transcription] }
  # The pod is up and ready a minute later: now the re-queue goes out.
  - at: 105660000
    observe:
      - { source: cluster-pods, value: { type: model_pods, model: whisperx, pods: 1, ready_pods: 1 } }
    refresh: true
    expect:
      steps: [{ type: run_recovery, class: speakr-transcription }]
