description: "Pods keep mounting basestar past mounts_timeout (30m): flowmanager alerts and stops, the host stays up and is not shut down even once the pods are gone, until a new manual lease takes it over."
power_control: managed
frames:
  - at: 100000000
    observe:
      - { source: cluster-pods, value: { type: model_pods, model: mineru, pods: 0, ready_pods: 0 } }
      - { source: cluster-pods, value: { type: model_pods, model: llm, pods: 0, ready_pods: 0 } }
      - { source: cluster-pods, value: { type: model_pods, model: whisperx, pods: 0, ready_pods: 0 } }
      - { source: cluster-pods, value: { type: model_pods, model: immich-ml, pods: 0, ready_pods: 0 } }
      - { source: cluster-pods, value: { type: resource_up, resource: cuda-central, up: true } }
      - { source: cluster-pods, value: { type: resource_up, resource: basestar-nfs, up: true } }
      - { source: basestar-mounts, value: { type: resource_mounts, resource: basestar-nfs, pods: 0 } }
      - { source: paperless-ocr-pending, value: { type: demand, class: paperless-ocr, ready: 0, in_flight: 0 } }
      - { source: paperless-post-ocr, value: { type: demand, class: paperless-tagging, ready: 0, in_flight: 0 } }
      - { source: speakr-pending, value: { type: demand, class: speakr-transcription, ready: 0, in_flight: 0 } }
      - { source: speakr-summaries, value: { type: demand, class: speakr-summarization, ready: 0, in_flight: 0 } }
      - { source: immich-queues, value: { type: demand, class: immich-ml, ready: 0, in_flight: 0 } }
      - { source: llm-sessions, value: { type: demand, class: interactive-llm, ready: 0, in_flight: 0 } }
    leases:
      - { id: manual-host-1, resource: basestar-nfs, granted_at: 100000000, kind: { type: manual_host } }
    expect:
      steps: []
      allowed: { models: [], classes: [paperless-ngx, immich-server, paperless-gpt] }
  - at: 100060000
    refresh: true
    observe:
      - { source: basestar-mounts, value: { type: resource_mounts, resource: basestar-nfs, pods: 2 } }
    leases: []
    expect:
      steps: []
      allowed: { models: [], classes: [paperless-ngx, immich-server, paperless-gpt] }
  # Idle grace (10m) over: due, and mounted. The idle drain scales the consumers down
  # (they leave the allowed set) while the shutdown waits for the pods to unmount.
  - at: 100660000
    refresh: true
    expect:
      steps: [{ type: wait, resource: basestar-nfs, reason: pods_mounted }]
      allowed: { models: [], classes: [] }
  # One second short of the timeout (30m after it became due).
  - at: 102459000
    refresh: true
    expect:
      steps: [{ type: wait, resource: basestar-nfs, reason: pods_mounted }]
      allowed: { models: [], classes: [] }
  # Timed out: stopped. Nothing is powered off, the idle drain ends and the consumers are
  # allowed again (nobody asked for them to stay down).
  - at: 102460000
    refresh: true
    expect:
      steps: [{ type: wait, resource: basestar-nfs, reason: shutdown_stopped }]
      allowed: { models: [], classes: [paperless-ngx, immich-server, paperless-gpt] }
  # The pods are gone, but a stopped scheduler does not retry by itself.
  - at: 102470000
    refresh: true
    observe:
      - { source: basestar-mounts, value: { type: resource_mounts, resource: basestar-nfs, pods: 0 } }
    expect:
      steps: [{ type: wait, resource: basestar-nfs, reason: shutdown_stopped }]
      allowed: { models: [], classes: [paperless-ngx, immich-server, paperless-gpt] }
  - at: 109000000
    refresh: true
    expect:
      steps: [{ type: wait, resource: basestar-nfs, reason: shutdown_stopped }]
      allowed: { models: [], classes: [paperless-ngx, immich-server, paperless-gpt] }
  # A person takes it over again with a new manual lease, then releases it: a fresh idle
  # period decides afresh, and with no pods mounting it the host is shut down.
  - at: 109010000
    refresh: true
    leases:
      - { id: manual-host-2, resource: basestar-nfs, granted_at: 109010000, kind: { type: manual_host } }
    expect:
      steps: []
      allowed: { models: [], classes: [paperless-ngx, immich-server, paperless-gpt] }
  - at: 109020000
    refresh: true
    leases: []
    expect:
      steps: []
      allowed: { models: [], classes: [paperless-ngx, immich-server, paperless-gpt] }
  - at: 109620000
    refresh: true
    expect:
      steps: [{ type: power_off, resource: basestar-nfs }]
      allowed: { models: [], classes: [] }
