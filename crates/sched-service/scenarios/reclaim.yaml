description: "A reclaim stops intake, gives in-flight work its timeout, stops it, runs the class's recovery action and shuts the host down; it is then not woken."
# The power machine as under managed control (M4).
power_control: managed
initial_state:
  resources:
    cuda-central:
      power: { phase: "on", since: 92800000 }
      mode: { phase: serving, model: whisperx, since: 97000000 }
frames:
  - at: 100000000
    observe:
      - { source: cluster-pods, value: { type: model_pods, model: mineru, pods: 0, ready_pods: 0 } }
      - { source: cluster-pods, value: { type: model_pods, model: llm, pods: 0, ready_pods: 0 } }
      - { source: cluster-pods, value: { type: model_pods, model: whisperx, pods: 0, ready_pods: 0 } }
      - { source: cluster-pods, value: { type: model_pods, model: immich-ml, pods: 0, ready_pods: 0 } }
      - { source: cluster-pods, value: { type: resource_up, resource: cuda-central, up: true } }
      - { source: cluster-pods, value: { type: resource_up, resource: basestar-nfs, up: true } }
      - { source: paperless-ocr-pending, value: { type: demand, class: paperless-ocr, ready: 0, in_flight: 0 } }
      - { source: paperless-post-ocr, value: { type: demand, class: paperless-tagging, ready: 0, in_flight: 0 } }
      - { source: speakr-pending, value: { type: demand, class: speakr-transcription, ready: 0, in_flight: 0 } }
      - { source: speakr-summaries, value: { type: demand, class: speakr-summarization, ready: 0, in_flight: 0 } }
      - { source: immich-queues, value: { type: demand, class: immich-ml, ready: 0, in_flight: 0 } }
      - { source: backup-schedule, value: { type: demand, class: backup, ready: 0, in_flight: 0 } }
      - { source: llm-sessions, value: { type: demand, class: interactive-llm, ready: 0, in_flight: 0 } }
      - { source: cluster-pods, value: { type: model_pods, model: whisperx, pods: 1, ready_pods: 1 } }
      - { source: speakr-pending, value: { type: demand, class: speakr-transcription, ready: 0, in_flight: 1 } }
    leases:
      - { id: reclaim-1, resource: cuda-central, granted_at: 100000000, kind: { type: reclaim } }
    expect:
      steps: [{ type: pause_intake, class: speakr-transcription }, { type: wait, resource: cuda-central, reason: in_flight_work }]
      allowed: { models: [whisperx], classes: [backup, paperless-ngx, immich-server] }
  # Halfway through the timeout.
  - at: 100300000
    refresh: true
    expect:
      steps: [{ type: wait, resource: cuda-central, reason: in_flight_work }]
      allowed: { models: [whisperx], classes: [backup, paperless-ngx, immich-server] }
  # Timeout over.
  - at: 100600000
    refresh: true
    expect:
      steps: [{ type: kill_in_flight, class: speakr-transcription }, { type: drain_model, resource: cuda-central, model: whisperx }]
      allowed: { models: [], classes: [backup, paperless-ngx, immich-server] }
  # Pods at zero: recovery runs and the host shuts down, overriding idle grace.
  - at: 100605000
    refresh: true
    observe:
      - { source: cluster-pods, value: { type: model_pods, model: whisperx, pods: 0, ready_pods: 0 } }
    expect:
      steps: [{ type: run_recovery, class: speakr-transcription }, { type: power_off, resource: cuda-central }]
      allowed: { models: [], classes: [backup, paperless-ngx, immich-server] }
  - at: 100610000
    refresh: true
    observe:
      - { source: cluster-pods, value: { type: resource_up, resource: cuda-central, up: false } }
    expect:
      steps: [{ type: wait, resource: cuda-central, reason: reclaimed }]
      allowed: { models: [], classes: [backup, paperless-ngx, immich-server] }
  # Reclaim released with work queued: the host is not woken (power is manual in v1); the intent waits.
  - at: 100700000
    refresh: true
    observe:
      - { source: paperless-ocr-pending, value: { type: demand, class: paperless-ocr, ready: 2, in_flight: 0, oldest_ready_at: 100000000 } }
    leases: []
    expect:
      steps: [{ type: wait, resource: cuda-central, reason: host_not_up }]
      allowed: { models: [], classes: [backup, paperless-ngx, immich-server] }
