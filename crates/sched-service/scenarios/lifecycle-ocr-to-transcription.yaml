description: "OCR serves, transcription waits past the age threshold, and the GPU switches models with intake stopped and in-flight work finished first."
frames:
  # OCR work appears while the GPU holds no model: allow mineru.
  - at: 100000000
    observe:
      - { source: cluster-pods, value: { type: model_pods, model: mineru, pods: 0, ready_pods: 0 } }
      - { source: cluster-pods, value: { type: model_pods, model: llm, pods: 0, ready_pods: 0 } }
      - { source: cluster-pods, value: { type: model_pods, model: whisperx, pods: 0, ready_pods: 0 } }
      - { source: cluster-pods, value: { type: model_pods, model: immich-ml, pods: 0, ready_pods: 0 } }
      - { source: cluster-pods, value: { type: resource_up, resource: cuda-central, up: true } }
      - { source: cluster-pods, value: { type: resource_up, resource: basestar-nfs, up: true } }
      - { source: paperless-ocr-pending, value: { type: demand, class: paperless-ocr, ready: 0, in_flight: 0 } }
      - { source: paperless-post-ocr, value: { type: demand, class: paperless-tagging, ready: 0, in_flight: 0 } }
      - { source: speakr-pending, value: { type: demand, class: speakr-transcription, ready: 0, in_flight: 0 } }
      - { source: speakr-summaries, value: { type: demand, class: speakr-summarization, ready: 0, in_flight: 0 } }
      - { source: immich-queues, value: { type: demand, class: immich-ml, ready: 0, in_flight: 0 } }
      - { source: backup-schedule, value: { type: demand, class: backup, ready: 0, in_flight: 0 } }
      - { source: llm-sessions, value: { type: demand, class: interactive-llm, ready: 0, in_flight: 0 } }
      - { source: paperless-ocr-pending, value: { type: demand, class: paperless-ocr, ready: 2, in_flight: 0, oldest_ready_at: 99999000 } }
    expect:
      steps: [{ type: allow_model, resource: cuda-central, model: mineru }]
      allowed: { models: [mineru], classes: [backup, paperless-ngx, immich-server] }
  - at: 100005000
    refresh: true
    observe:
      - { source: cluster-pods, value: { type: model_pods, model: mineru, pods: 1, ready_pods: 0 } }
    expect:
      steps: [{ type: wait, resource: cuda-central, reason: loading }]
      allowed: { models: [mineru], classes: [backup, paperless-ngx, immich-server] }
  # mineru is ready: serving, and its class is allowed.
  - at: 100010000
    refresh: true
    observe:
      - { source: cluster-pods, value: { type: model_pods, model: mineru, pods: 1, ready_pods: 1 } }
    expect:
      steps: []
      allowed: { models: [mineru], classes: [backup, paperless-ngx, immich-server, paperless-ocr] }
  # Transcription waits, but mineru has served less than min_dwell and nothing is starved: no yield.
  - at: 100060000
    refresh: true
    observe:
      - { source: speakr-pending, value: { type: demand, class: speakr-transcription, ready: 1, in_flight: 0, oldest_ready_at: 100055000 } }
      - { source: paperless-ocr-pending, value: { type: demand, class: paperless-ocr, ready: 2, in_flight: 1, oldest_ready_at: 99999000 } }
    expect:
      steps: []
      allowed: { models: [mineru], classes: [backup, paperless-ngx, immich-server, paperless-ocr] }
  # Transcription has waited past age_threshold: mineru yields; intake stops and in-flight work finishes.
  - at: 103600000
    refresh: true
    observe:
      - { source: paperless-ocr-pending, value: { type: demand, class: paperless-ocr, ready: 2, in_flight: 1, oldest_ready_at: 103500000 } }
    expect:
      steps: [{ type: pause_intake, class: paperless-ocr }, { type: wait, resource: cuda-central, reason: in_flight_work }]
      allowed: { models: [mineru], classes: [backup, paperless-ngx, immich-server] }
  # In-flight work is done: withdraw mineru.
  - at: 103610000
    refresh: true
    observe:
      - { source: paperless-ocr-pending, value: { type: demand, class: paperless-ocr, ready: 2, in_flight: 0, oldest_ready_at: 103500000 } }
    expect:
      steps: [{ type: drain_model, resource: cuda-central, model: mineru }]
      allowed: { models: [], classes: [backup, paperless-ngx, immich-server] }
  - at: 103615000
    refresh: true
    observe:
      - { source: cluster-pods, value: { type: model_pods, model: mineru, pods: 1, ready_pods: 1 } }
    expect:
      steps: [{ type: wait, resource: cuda-central, reason: draining }]
      allowed: { models: [], classes: [backup, paperless-ngx, immich-server] }
  # Zero pods observed: whisperx is allowed in the same tick.
  - at: 103620000
    refresh: true
    observe:
      - { source: cluster-pods, value: { type: model_pods, model: mineru, pods: 0, ready_pods: 0 } }
    expect:
      steps: [{ type: allow_model, resource: cuda-central, model: whisperx }]
      allowed: { models: [whisperx], classes: [backup, paperless-ngx, immich-server] }
  - at: 103625000
    refresh: true
    observe:
      - { source: cluster-pods, value: { type: model_pods, model: whisperx, pods: 1, ready_pods: 1 } }
    expect:
      steps: []
      allowed: { models: [whisperx], classes: [backup, paperless-ngx, immich-server, speakr-transcription] }
